services:
  wifi_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: captyn_wifi
      POSTGRES_USER: captyn_wifi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - wifi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captyn_wifi -d captyn_wifi"]
      interval: 10s
      timeout: 5s
      retries: 5

  wifi_api:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm ci && npm run prisma:deploy && npm run build && npm start"
    env_file:
      - .env
    ports:
      - "${CAPTYN_WIFI_BIND_IP:-127.0.0.1}:${PORT:-4120}:4120"
    volumes:
      - .:/app
    depends_on:
      wifi_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 --spider http://localhost:4120/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  radius_worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm ci && npm run prisma:deploy && npm run build && npm run radius:worker"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      wifi_db:
        condition: service_healthy
    restart: unless-stopped

  freeradius:
    build:
      context: ./freeradius
    env_file:
      - .env
    ports:
      - "${CAPTYN_WIFI_RADIUS_BIND_IP:-10.8.0.2}:1812:1812/udp"
      - "${CAPTYN_WIFI_RADIUS_BIND_IP:-10.8.0.2}:1813:1813/udp"
    depends_on:
      wifi_db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "PATH=/opt/sbin:/opt/bin:$$PATH radiusd -C"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

volumes:
  wifi_postgres_data:
