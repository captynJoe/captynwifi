services:
  wifi_db:
    image: postgres:16-alpine
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      POSTGRES_DB: captyn_wifi
      POSTGRES_USER: captyn_wifi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - wifi_postgres_data:/var/lib/postgresql/data
    cpus: ${CAPTYN_WIFI_DB_CPUS:-0.25}
    mem_limit: ${CAPTYN_WIFI_DB_MEM_LIMIT:-512m}
    memswap_limit: ${CAPTYN_WIFI_DB_MEMSWAP_LIMIT:-768m}
    mem_reservation: ${CAPTYN_WIFI_DB_MEM_RESERVATION:-128m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captyn_wifi -d captyn_wifi"]
      interval: 10s
      timeout: 5s
      retries: 5

  wifi_api:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm ci && npm run prisma:deploy && npm run build && npm start"
    env_file:
      - .env
    ports:
      - "${CAPTYN_WIFI_BIND_IP:-127.0.0.1}:${PORT:-4120}:4120"
    volumes:
      - .:/app
      - wifi_api_node_modules:/app/node_modules
    depends_on:
      wifi_db:
        condition: service_healthy
    restart: unless-stopped
    cpus: ${CAPTYN_WIFI_API_CPUS:-0.35}
    mem_limit: ${CAPTYN_WIFI_API_MEM_LIMIT:-384m}
    memswap_limit: ${CAPTYN_WIFI_API_MEMSWAP_LIMIT:-512m}
    mem_reservation: ${CAPTYN_WIFI_API_MEM_RESERVATION:-192m}
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 --spider http://localhost:4120/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  radius_worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm ci && npm run prisma:deploy && npm run build && npm run radius:worker"
    env_file:
      - .env
    volumes:
      - .:/app
      - radius_worker_node_modules:/app/node_modules
    depends_on:
      wifi_db:
        condition: service_healthy
    cpus: ${CAPTYN_WIFI_RADIUS_WORKER_CPUS:-0.25}
    mem_limit: ${CAPTYN_WIFI_RADIUS_WORKER_MEM_LIMIT:-256m}
    memswap_limit: ${CAPTYN_WIFI_RADIUS_WORKER_MEMSWAP_LIMIT:-384m}
    mem_reservation: ${CAPTYN_WIFI_RADIUS_WORKER_MEM_RESERVATION:-128m}
    restart: unless-stopped

  wifi_governor:
    image: node:22-alpine
    working_dir: /app
    command: sh -lc "npm ci && npm run prisma:deploy && npm run build && npm run governor:worker"
    profiles:
      - governor
    env_file:
      - .env
    environment:
      CAPTYN_WIFI_GOVERNOR_ENABLED: ${CAPTYN_WIFI_GOVERNOR_ENABLED:-true}
      CAPTYN_WIFI_GOVERNOR_DRY_RUN: ${CAPTYN_WIFI_GOVERNOR_DRY_RUN:-true}
      CAPTYN_WIFI_DYNAMIC_PLAN_ENABLED: ${CAPTYN_WIFI_DYNAMIC_PLAN_ENABLED:-false}
      CAPTYN_WIFI_DYNAMIC_PLAN_DRY_RUN: ${CAPTYN_WIFI_DYNAMIC_PLAN_DRY_RUN:-true}
    volumes:
      - .:/app
      - wifi_governor_node_modules:/app/node_modules
    depends_on:
      wifi_db:
        condition: service_healthy
    cpus: ${CAPTYN_WIFI_GOVERNOR_CPUS:-0.25}
    mem_limit: ${CAPTYN_WIFI_GOVERNOR_MEM_LIMIT:-256m}
    mem_reservation: ${CAPTYN_WIFI_GOVERNOR_MEM_RESERVATION:-128m}
    restart: unless-stopped

  freeradius:
    build:
      context: ./freeradius
    env_file:
      - .env
    ports:
      - "${CAPTYN_WIFI_RADIUS_BIND_IP:-10.8.0.2}:1812:1812/udp"
      - "${CAPTYN_WIFI_RADIUS_BIND_IP:-10.8.0.2}:1813:1813/udp"
    depends_on:
      wifi_db:
        condition: service_healthy
    restart: unless-stopped
    cpus: ${CAPTYN_WIFI_FREERADIUS_CPUS:-0.20}
    mem_limit: ${CAPTYN_WIFI_FREERADIUS_MEM_LIMIT:-128m}
    memswap_limit: ${CAPTYN_WIFI_FREERADIUS_MEMSWAP_LIMIT:-192m}
    mem_reservation: ${CAPTYN_WIFI_FREERADIUS_MEM_RESERVATION:-64m}
    labels:
      autoheal: "true"
    healthcheck:
      # `radiusd -C` (the previous check) is a full config reload: it
      # re-instantiates every module -- including reconnecting rlm_sql to
      # Postgres -- from a brand-new process, once a minute. That's heavy
      # enough to intermittently starve the *running* daemon right as a real
      # auth request comes in, and MikroTik's RADIUS client only waits 3s
      # before giving up with "RADIUS server is not responding" -- which
      # matches the confirmed timing of the intermittent auth failures.
      # This instead sends a real Access-Request to the already-running
      # daemon and just checks that *any* response comes back (Accept or
      # Reject both prove it's alive) -- no new process, no config reload.
      test: ["CMD-SHELL", "PATH=/opt/sbin:/opt/bin:$$PATH; echo 'User-Name=healthcheck,User-Password=healthcheck' | radclient -t 3 -r 1 127.0.0.1:1812 auth \"$$CAPTYN_WIFI_RADIUS_SECRET\" 2>&1 | grep -q '^Received '"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

volumes:
  wifi_postgres_data:
  wifi_api_node_modules:
  radius_worker_node_modules:
  wifi_governor_node_modules:
