<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage your CAPTYN WiFi devices</title>
    <script src="theme.js?v=2026080402"></script>
    <link rel="stylesheet" href="theme.css?v=2026080924" />
    <link rel="stylesheet" href="portal.css?v=2026100603" />
  </head>
  <body>
    <main class="portal-app">
      <header class="topbar">
        <a class="brand" href="/wifi/" aria-label="CAPTYN WiFi">
          <span><span class="eyebrow">CAPTYN</span><strong>WiFi</strong></span>
        </a>
        <div class="topbar-status topbar-controls">
          <div class="settings-control">
            <button id="settings-toggle-btn" class="settings-toggle" type="button" aria-label="Open settings" aria-controls="settings-menu" aria-expanded="false">⚙</button>
            <div id="settings-menu" class="settings-menu hidden" role="menu" aria-label="Settings">
              <button id="theme-toggle-btn" class="theme-toggle settings-menu-item" type="button" role="menuitem">Theme</button>
            </div>
          </div>
        </div>
      </header>

      <section id="devices-login" class="checkout-panel">
        <div class="section-head">
          <h2>Manage your devices</h2>
        </div>
        <p class="status-text">This works from any browser, anytime — you don't need to be connected to CAPTYN WiFi right now. Enter the username and password you got when you bought your plan.</p>
        <form id="devices-login-form" class="payment-form">
          <label class="field" for="devices-username"><span>Username</span><input id="devices-username" name="username" type="text" inputmode="tel" autocomplete="username" required /></label>
          <label class="field" for="devices-password"><span>Password</span><input id="devices-password" name="password" type="text" autocomplete="current-password" required /></label>
          <button id="devices-login-submit" class="primary" type="submit">View my devices</button>
        </form>
        <p id="devices-login-status" class="status-text"></p>
        <a class="sponsor-link checkout-sponsor" href="https://captyn.shop/" target="_blank" rel="noopener">Powered by captyn.shop</a>
      </section>

      <section id="devices-manage" class="access-panel hidden">
        <div class="section-head">
          <h2>Your devices</h2>
          <span class="pill ok" id="devices-manage-limit"></span>
        </div>
        <div id="devices-manage-list" class="access-devices-list"></div>
        <p id="devices-manage-status" class="status-text"></p>
        <button id="devices-manage-switch" class="ghost existing-login-toggle" type="button">Check a different account</button>
        <a class="sponsor-link checkout-sponsor" href="https://captyn.shop/" target="_blank" rel="noopener">Powered by captyn.shop</a>
      </section>
    </main>
    <script type="module" src="portal-build/devices.js?v=2026092001" data-cfasync="false"></script>
  </body>
</html>
