<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAPTYN WiFi</title>
<meta http-equiv="refresh" content="0;url=https://captyn.shop/wifi/?mac=$(mac)&amp;ip=$(ip)&amp;hsLogin=$(link-login-only)&amp;hsOrig=$(link-orig-esc)&amp;error=$(error)">
<style>
  :root { color-scheme: light; --blue: #2454e6; --ink: #07111f; --muted: #58667a; --line: #dce4f2; --soft: #f4f7fb; }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: radial-gradient(circle at top, #ffffff 0, var(--soft) 58%, #eaf0fb 100%);
  }
  main {
    width: min(420px, 100%); padding: 28px 22px 24px; text-align: center;
    background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 24px 70px rgba(13, 32, 70, .14);
  }
  .brand { display: grid; gap: 2px; margin-bottom: 18px; }
  .brand small { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .16em; }
  .brand strong { font-size: 28px; line-height: 1; font-weight: 850; }
  .loader {
    width: 42px; height: 42px; margin: 0 auto 16px; border-radius: 999px;
    border: 4px solid #d9e3f5; border-top-color: var(--blue); animation: spin .8s linear infinite;
  }
  h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.15; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
  a.continue {
    min-height: 50px; display: inline-flex; align-items: center; justify-content: center; width: 100%; margin-top: 20px;
    padding: 0 22px; border-radius: 14px; background: var(--blue); color: #fff;
    text-decoration: none; font-size: 16px; font-weight: 800; box-shadow: 0 14px 32px rgba(36, 84, 230, .24);
  }
  .hint { margin-top: 12px; font-size: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body data-mac="$(mac)" data-ip="$(ip)" data-login="$(link-login-only)" data-orig="$(link-orig-esc)" data-error="$(error)">
<main>
  <div class="brand"><small>CAPTYN</small><strong>WiFi</strong></div>
  <div class="loader" aria-hidden="true"></div>
  <h1>Opening WiFi packages</h1>
  <p>If this screen does not move automatically, tap below to continue.</p>
  <a class="continue" href="https://captyn.shop/wifi/?mac=$(mac)&amp;ip=$(ip)&amp;hsLogin=$(link-login-only)&amp;hsOrig=$(link-orig-esc)&amp;error=$(error)">Continue to CAPTYN WiFi</a>
  <p class="hint">Keep this WiFi network selected while the page opens.</p>
</main>
<script>
  (function () {
    var b = document.body;
    var params = new URLSearchParams({
      mac: b.dataset.mac || "",
      ip: b.dataset.ip || "",
      hsLogin: b.dataset.login || "",
      hsOrig: b.dataset.orig || "",
      error: b.dataset.error || ""
    });
    window.location.replace("https://captyn.shop/wifi/?" + params.toString());
  }());
</script>
</body>
</html>
