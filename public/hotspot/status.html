<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020403">
<meta http-equiv="refresh" content="60">
<title>CAPTYN WiFi status</title>
<style>:root{--bg:#020403;--panel:rgba(7,18,13,.78);--line:rgba(32,245,154,.2);--line2:rgba(32,245,154,.08);--text:#e6fff1;--muted:#7fa893;--green:#20f59a;--cyan:#23ddff;--amber:#ffd166;--red:#ff5d6c;--accent:var(--green)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono,.con,.tile b,.tag{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace}
.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 0%,rgba(32,245,154,.16),transparent 70%),radial-gradient(40% 35% at 85% 90%,rgba(35,221,255,.10),transparent 70%)}
.amber .bg{background:radial-gradient(60% 45% at 50% 0%,rgba(255,209,102,.14),transparent 70%)}.red .bg{background:radial-gradient(60% 45% at 50% 0%,rgba(255,93,108,.14),transparent 70%)}
.amber .bg:before,.red .bg:before{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px)}
.bg:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(80% 70% at 50% 30%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(80% 70% at 50% 30%,#000 30%,transparent 80%)}
.bg:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
main{position:relative;max-width:420px;margin:0 auto;padding:22px 16px 28px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:800;letter-spacing:.18em}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1.6s ease-in-out infinite}
.tag{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:10px;color:var(--accent)}
.radar{position:relative;width:132px;height:132px;margin:6px auto 0}
.radar svg{position:absolute;inset:0;width:100%;height:100%}
.radar circle{fill:none;stroke:var(--accent);stroke-opacity:.28;stroke-width:1}
.radar .sweep{position:absolute;inset:6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 300deg,color-mix(in srgb,var(--accent) 55%,transparent) 360deg);animation:spin 2.4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 18%,#000 19%);mask:radial-gradient(circle,transparent 18%,#000 19%)}
.radar .core{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;background:rgba(2,4,3,.9);border:1px solid var(--accent);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.radar .core svg{position:static;width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.radar .ping{position:absolute;inset:40px;border-radius:50%;border:1px solid var(--accent);animation:ping 2.4s ease-out infinite}
h1{margin:4px 0 0;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(19px,6.6vw,26px);letter-spacing:.14em;white-space:nowrap;text-transform:uppercase;color:var(--accent);text-shadow:0 0 18px color-mix(in srgb,var(--accent) 50%,transparent)}
.sub{margin:-6px 0 0;text-align:center;color:var(--muted);font-size:14px}
.con{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.75;overflow:hidden;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.con div{display:flex;gap:10px;white-space:nowrap;opacity:0;animation:type .28s steps(6) forwards}
.con div:nth-child(1){animation-delay:.05s}.con div:nth-child(2){animation-delay:.25s}.con div:nth-child(3){animation-delay:.45s}.con div:nth-child(4){animation-delay:.65s}.con div:nth-child(5){animation-delay:.85s}.con div:nth-child(6){animation-delay:1.05s}
.con span{color:var(--muted);min-width:76px}.con span:before{content:"> ";color:var(--accent)}
.con em{font-style:normal;color:var(--text);overflow:hidden;text-overflow:ellipsis}
.con .ok{color:var(--green)}.con .warn{color:var(--amber)}.con .bad{color:var(--red)}
.cur:after{content:"_";color:var(--accent);animation:blink 1s steps(1) infinite}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;margin-top:2px;font-size:17px;font-weight:700;color:var(--text);overflow-wrap:anywhere}
.tile.wide b{font-size:30px;color:var(--accent);letter-spacing:.04em}
.bar{height:3px;margin-top:8px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;width:38%;background:linear-gradient(90deg,var(--accent),var(--cyan));animation:scan 1.8s ease-in-out infinite}
.reason{background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.acts{display:grid;gap:10px;margin-top:auto}
.btn{display:block;text-align:center;text-decoration:none;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:14px;border-radius:12px;color:#02140b;background:var(--accent);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);box-shadow:none}
.foot{text-align:center;font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:.06em}
.foot b{color:var(--text)}
.amber{--accent:var(--amber);--line:rgba(255,209,102,.22)}.red{--accent:var(--red);--line:rgba(255,93,108,.24)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.3);opacity:0}}
@keyframes blink{50%{opacity:.25}}
@keyframes type{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(270%)}}
@supports not (color:color-mix(in srgb,red,blue)){.radar .sweep{background:conic-gradient(from 0deg,transparent 0 300deg,rgba(32,245,154,.5) 360deg)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}.con div{opacity:1}}</style>
</head>
<body class="">
<div class="bg" aria-hidden="true"></div>
<main>
<div class="top"><div class="brand"><i></i>CAPTYN</div><span class="tag">live</span></div>

<div class="radar" aria-hidden="true"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="64"/><circle cx="66" cy="66" r="46"/><circle cx="66" cy="66" r="28"/></svg><div class="sweep"></div><div class="ping"></div><div class="core"><svg viewBox="0 0 24 24"><path d="M4 9.5a12 12 0 0 1 16 0M7 13a7.5 7.5 0 0 1 10 0M10 16.5a3 3 0 0 1 4 0"/><circle cx="12" cy="19.5" r=".9"/></svg></div></div>
<h1>Online</h1>
<div class="tiles">
$(if session-time-left)<div class="tile wide"><small>Time left</small><b data-tick="$(session-time-left)">$(session-time-left)</b></div>$(endif)
<div class="tile"><small>Online for</small><b data-tick="$(uptime)" data-dir="up">$(uptime)</b></div>
<div class="tile"><small>Address</small><b>$(ip)</b></div>
<div class="tile"><small>Downloaded</small><b>$(bytes-out-nice)</b></div>
<div class="tile"><small>Uploaded</small><b>$(bytes-in-nice)</b></div>
</div>
<div class="con"><div><span>device</span><em data-mac="$(mac)">$(mac)</em></div><div><span>link</span><em class="ok cur">stable</em></div></div>
<div class="acts"><a class="btn" href="https://captyn.shop/wifi/">Add time</a><a class="btn ghost" href="$(link-logout)">Sign out</a></div>

<a class="foot" href="https://captyn.shop/">Powered by <b>captyn.shop</b></a>
</main>
<script>(function(){
  function secs(t){var m=String(t||"").match(/(\d+)\s*([wdhms])/g),u={w:604800,d:86400,h:3600,m:60,s:1},n=0;if(!m)return null;m.forEach(function(p){var x=p.match(/(\d+)\s*([wdhms])/);n+=x[1]*u[x[2]]});return n}
  function fmt(n){n=Math.max(0,n|0);var d=Math.floor(n/86400),h=Math.floor(n%86400/3600),m=Math.floor(n%3600/60),s=n%60;function p(x){return(x<10?"0":"")+x}return(d?d+"d ":"")+p(h)+":"+p(m)+":"+p(s)}
  document.querySelectorAll("[data-mac]").forEach(function(el){var o=(el.getAttribute("data-mac")||"").split(":");if(o.length===6)el.textContent="••:••:••:••:"+o[4]+":"+o[5]});
  var clocks=[];document.querySelectorAll("[data-tick]").forEach(function(el){var n=secs(el.getAttribute("data-tick"));if(n!==null){clocks.push({el:el,n:n,dir:el.getAttribute("data-dir")==="up"?1:-1});el.textContent=fmt(n)}});
  if(clocks.length)setInterval(function(){clocks.forEach(function(c){c.n+=c.dir;c.el.textContent=fmt(c.n)})},1000);
}());</script>
</body>
</html>
